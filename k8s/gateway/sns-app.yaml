apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sns-app
  namespace: sns
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - sns.localhost
  rules:
    - backendRefs:
        - name: sns-app
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: rustfs
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - rustfs.localhost
  rules:
    - backendRefs:
        - name: rustfs
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-admin
  namespace: rustfs
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - rustfs-admin.localhost
  rules:
    - backendRefs:
        - name: rustfs
          port: 9001
