apiVersion: apps/v1
kind: Deployment
metadata:
  name: sns-recommend
  namespace: sns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sns-recommend
  template:
    metadata:
      labels:
        app: sns-recommend
    spec:
      containers:
        - name: sns-recommend
          image: sns-recommend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4318
            - name: FAST_MS
              value: "40"
            - name: SLOW_MS
              value: "260"
            - name: JITTER_MS
              value: "60"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: sns-recommend
  namespace: sns
  labels:
    app: sns-recommend
spec:
  type: ClusterIP
  selector:
    app: sns-recommend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
